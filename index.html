<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой план дня</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@600&display=swap">
<style>
:root{--bg:#f4f3ee;--s1:#fff;--s2:#ecebe4;--ln:#dcdad0;--tx:#15171b;--mu:#6b7280;--ac:#ffc21a;--on:#15171b;--ok:#14915f;--bad:#c9402c}
[data-theme=dark]{--bg:#101216;--s1:#181b21;--s2:#20242c;--ln:#2a2f39;--tx:#f2f3f5;--mu:#8a93a3;--ok:#3ddc97;--bad:#ff6b57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:500 16px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding:18px 16px 120px}
.num{font-family:Unbounded,Manrope,system-ui,sans-serif;font-weight:600;letter-spacing:-.02em}
h1{font-size:26px;line-height:1.12;margin:0;font-weight:800}
.mu{color:var(--mu)} .sm{font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:60px;border:1px solid var(--ln);background:var(--s1);color:var(--tx);border-radius:16px;padding:8px 10px;text-align:center;font:800 17px Manrope,system-ui,sans-serif;position:relative}
.chip small{display:block;font-weight:500;font-size:12px;color:var(--mu)}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.chip.on small{color:var(--on);opacity:.7}
.chip.dot::after{content:"";position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-top:12px}
.card.dim{opacity:.65}
.hero{background:var(--ac);border-color:var(--ac);color:var(--on)}
.lb{font-size:13px;font-weight:700;color:var(--mu)}
.hero .lb{color:var(--on);opacity:.7}
.big{font-size:32px;line-height:1.1;margin:4px 0 2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .card{margin-top:12px}
.two .big{font-size:26px}
.bar{height:9px;border-radius:99px;background:var(--s2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ac);transition:width .25s}
.hero .bar{background:rgba(0,0,0,.16)} .hero .bar i{background:var(--on)}
.in{width:100%;font:800 22px Manrope,system-ui,sans-serif;color:var(--tx);background:var(--s2);border:1px solid transparent;border-radius:14px;padding:12px 14px;margin-top:12px}
.hero .in{background:rgba(255,255,255,.6);color:var(--on)}
.in.s{font-size:18px;margin-top:4px}
.in::placeholder{color:var(--mu);font-weight:500}
.in:focus{outline:2px solid var(--tx);outline-offset:1px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:52px;height:52px;border-radius:16px;border:0;background:var(--s2);color:var(--tx);font:700 26px Manrope,sans-serif}
.step button:last-child{background:var(--ac);color:var(--on)}
.step .num{min-width:48px;text-align:center;font-size:24px}
.env{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ln)}
.env:first-of-type{border-top:0}
.box{flex:none;width:34px;height:34px;border-radius:11px;border:2px solid var(--ln);background:transparent;color:var(--on);font:800 18px Manrope,sans-serif;padding:0}
.env.ck .box{background:var(--ok);border-color:var(--ok);color:#fff}
.env.ck .eb b{text-decoration:line-through;opacity:.6}
.eb{flex:1;min-width:0}
.er{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.eb .bar{margin-top:7px;height:6px}
.foot{margin:10px 0 0;font-size:15px}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--s2);color:var(--mu);white-space:nowrap}
.tag.ok{background:var(--ok);color:#fff} .tag.bad{background:var(--bad);color:#fff}
.ttl{font-weight:800;font-size:18px}
.nm{margin-top:12px;font-size:13px;background:var(--s2);border-radius:12px;padding:8px 12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.f2 label,.fl{font-size:12px;font-weight:700;color:var(--mu);display:block}
.wide{width:100%;margin-top:12px;min-height:48px;border-radius:14px;border:1px solid var(--ln);background:transparent;color:var(--tx);font:700 15px Manrope,sans-serif}
.wide.on{background:var(--ok);border-color:var(--ok);color:#fff}
.wk{width:100%;display:grid;grid-template-columns:1.3fr .8fr 1fr .8fr;gap:6px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--ln);padding:12px 0;color:var(--tx);font:500 15px Manrope,sans-serif}
.wk:first-child{border-top:0}
.df{text-align:right;font-weight:800;font-size:13px} .df.ok{color:var(--ok)} .df.bad{color:var(--bad)}
.reset{margin-top:20px;background:none;border:0;color:var(--mu);font:700 14px Manrope,sans-serif;padding:12px;text-decoration:underline}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln)}
.tabs button{flex:1;max-width:180px;min-height:46px;border-radius:15px;border:0;background:var(--s1);color:var(--mu);font:800 15px Manrope,sans-serif}
.tabs button.on{background:var(--ac);color:var(--on)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <button data-act="tab" data-t="day">День</button>
  <button data-act="tab" data-t="pay">Платежи</button>
  <button data-act="tab" data-t="week">Неделя</button>
</nav>
<script>
(function(){
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();}catch(e){}}
const th=(tg&&tg.colorScheme)||((window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark");
document.documentElement.setAttribute("data-theme",th);
if(tg){try{const c=th==="dark"?"#101216":"#f4f3ee";tg.setHeaderColor(c);tg.setBackgroundColor(c);}catch(e){}}

const KEY="plan-v2-web", NORM=8000, GOAL=82;
const PAY=[
 {id:"p1",t:"Долг",d:"2026-11-20",a:20000,n:"до пятницы",nm:"3 670 ₽ в день с 18 по 20 ноября (плюс 9 000 ₽, что уже есть)"},
 {id:"p2",t:"Перевод",d:"2026-11-22",a:2500,n:"до воскресенья",nm:"1 250 ₽ в день, 21 и 22 ноября"},
 {id:"p3",t:"Аренда авто",d:"2026-11-23",a:35000,n:"в понедельник, допустимо до вторника",nm:"3 330 ₽ в день 18–20 ноября, 5 750 ₽ в день 21–22 ноября, 7 000 ₽ в день 23–24 ноября"},
 {id:"p4",t:"Долг",d:"2026-12-14",a:38000,n:"до 14 декабря",nm:"около 1 900 ₽ в день с 25 ноября по 14 декабря, сверх еженедельной аренды"}
];
const DAYS=[]; for(let i=18;i<=24;i++){DAYS.push("2026-11-"+i);}
const WD=["вс","пн","вт","ср","чт","пт","сб"];
const WDF=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

let S={pay:{},days:{},g:{}};
try{const r=localStorage.getItem(KEY); if(r){S=JSON.parse(r)||S;}}catch(e){}
S.pay=S.pay||{}; S.days=S.days||{}; S.g=S.g||{};

/*STORE*/
let ref=null,tm=null;
function remoteSave(){
  if(!ref){return;}
  clearTimeout(tm);
  tm=setTimeout(()=>{ref.set({state:JSON.stringify(S),updated:new Date().toISOString()}).catch(()=>{});},700);
}
function loadRemote(done){
  if(!(window.claude&&window.claude.use)){done();return;}
  window.claude.use("db").then(db=>{
    if(!db){done();return;}
    const r=db.doc("plan/main");
    return r.get().then(snap=>{
      const has=snap&&snap.exists;
      if(has){try{const d=JSON.parse(snap.data().state);S.pay=d.pay||{};S.days=d.days||{};S.g=d.g||{};}catch(e){}}
      ref=r;
      if(!has){remoteSave();}
      done();
    });
  }).catch(()=>{done();});
}
/*ENDSTORE*/

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} remoteSave();}
const num=v=>parseInt(String(v==null?"":v).replace(/\D/g,""),10)||0;
const nf=n=>Math.round(n).toLocaleString("ru-RU");
const fmt=n=>nf(n)+" ₽";
const pd=s=>{const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);};
const label=s=>{const d=pd(s);return WD[d.getDay()]+", "+d.getDate()+" "+MON[d.getMonth()];};
const todayMs=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate()).getTime();};
const D=d=>S.days[d]||(S.days[d]={});
const P=id=>S.pay[id]||(S.pay[id]={});
const amt=p=>{const v=P(p.id).amt;return (v===undefined||v==="")?p.a:num(v);};
const paid=p=>{const x=P(p.id);return x.done?amt(p):num(x.paid);};
function plan(d){
  const n=+d.slice(8), f={k:"fuel",t:"Топливо на завтра",a:1000};
  if(n<=20){return [f,{k:"debt",t:"Долг к пятнице",a:3670},{k:"rent",t:"Аренда авто",a:3330}];}
  if(n<=22){return [f,{k:"tr",t:"Перевод 2 500",a:1250},{k:"rent",t:"Аренда авто",a:5750}];}
  return [f,{k:"rent",t:"Аренда авто",a:7000}];
}
const goalOrd=d=>(+d.slice(8)<=20?28:0);
function stats(){
  let tot=0,got=0;
  PAY.forEach(p=>{const a=amt(p);tot+=a;got+=Math.min(paid(p),a);});
  let done=num(S.g.base); DAYS.forEach(d=>{done+=num(D(d).ord);});
  const left=Math.max(0,GOAL-done), cur=new Date().getDate();
  const dl=DAYS.filter(d=>{const n=+d.slice(8);return n>=cur&&n<=20&&!num(D(d).ord);}).length;
  return {tot,got,left,dl,norm:dl?Math.ceil(left/dl):0};
}

const t0=new Date(), key0="2026-11-"+t0.getDate();
const ui={tab:"day",day:(t0.getMonth()===10&&DAYS.indexOf(key0)>-1)?key0:DAYS[0]};

function vDay(){
  const d=ui.day, x=D(d), rev=num(x.rev), ord=num(x.ord), pl=plan(d), st=stats(), g=goalOrd(d), dt=pd(d);
  let rem=rev;
  const rows=pl.map(it=>{
    const al=Math.min(rem,it.a); rem-=al;
    const ck=x.c&&x.c[it.k];
    return `<div class="env ${ck?"ck":""}"><button class="box" data-act="chk" data-k="${it.k}" aria-label="Отметить: ${it.t}">${ck?"✓":""}</button><div class="eb"><div class="er"><b>${it.t}</b><span class="num sm">${fmt(it.a)}</span></div><div class="bar"><i style="width:${it.a?al/it.a*100:0}%"></i></div></div></div>`;
  }).join("");
  const sum=pl.reduce((s,i)=>s+i.a,0);
  const foot=rev===0?`<span class="mu">Впиши выручку, и здесь появится раскладка по конвертам.</span>`:(rev>=sum?`Личное и остаток: <b>${fmt(rem)}</b>`:`До нормы не хватает: <b>${fmt(sum-rev)}</b>`);
  const chips=DAYS.map(k=>`<button class="chip ${k===d?"on":""} ${num(D(k).rev)?"dot":""}" data-act="day" data-d="${k}">${+k.slice(8)}<small>${WD[pd(k).getDay()]}</small></button>`).join("");
  return `<h1>${WDF[dt.getDay()]}, ${dt.getDate()} ${MON[dt.getMonth()]}</h1>
  <div class="chips">${chips}</div>
  <section class="card hero"><div class="lb">Выручка за день</div><div class="big num">${fmt(rev)}</div><div class="sm">из ${fmt(NORM)}</div><div class="bar"><i style="width:${Math.min(100,rev/NORM*100)}%"></i></div><input class="in" data-f="rev" inputmode="numeric" placeholder="Впиши выручку" value="${rev||""}" aria-label="Выручка за день"></section>
  <div class="two">
    <section class="card"><div class="lb">Заказов осталось</div><div class="big num">${st.left}</div><div class="mu sm">из ${GOAL} · ${st.left===0?"готово":(st.dl?"норма "+st.norm+" в день":"сроки вышли")}</div></section>
    <section class="card"><div class="lb">К оплате</div><div class="big num">${nf(st.tot-st.got)}</div><div class="mu sm">₽ из ${nf(st.tot)}</div></section>
  </div>
  <section class="card"><div class="row"><div><div class="lb">Заказы за день</div><div class="mu sm">${g?"цель "+g:"цели на этот день нет"}</div></div><div class="step"><button data-act="dec" aria-label="Минус один заказ">−</button><span class="num">${ord}</span><button data-act="inc" aria-label="Плюс один заказ">+</button></div></div>${g?`<div class="bar"><i style="width:${Math.min(100,ord/g*100)}%"></i></div>`:""}</section>
  <section class="card"><b>Куда положить</b><div style="margin-top:6px">${rows}</div><p class="foot">${foot}</p></section>`;
}

function vPay(){
  const st=stats();
  const head=`<h1>Платежи</h1><div class="mu" style="margin-top:2px">Осталось внести ${fmt(st.tot-st.got)} из ${fmt(st.tot)}</div>`;
  const cards=PAY.map(p=>{
    const a=amt(p), gp=Math.min(paid(p),a), x=P(p.id);
    const late=!x.done&&gp<a&&pd(p.d).getTime()<todayMs();
    const tag=(x.done||gp>=a)?`<span class="tag ok">Оплачено</span>`:(late?`<span class="tag bad">Просрочено</span>`:`<span class="tag">Осталось ${fmt(a-gp)}</span>`);
    return `<section class="card ${x.done?"dim":""}"><div class="row"><div><div class="ttl">${p.t}</div><div class="mu sm">${label(p.d)} · ${p.n}</div></div>${tag}</div>
    <div class="bar"><i style="width:${a?gp/a*100:0}%"></i></div>
    <div class="nm">Норма: ${p.nm}</div>
    <div class="f2"><label>Сумма, ₽<input class="in s" data-f="amt" data-id="${p.id}" inputmode="numeric" value="${a}"></label><label>Внесено, ₽<input class="in s" data-f="paid" data-id="${p.id}" inputmode="numeric" value="${x.paid||""}" placeholder="0"></label></div>
    <button class="wide ${x.done?"on":""}" data-act="paid" data-id="${p.id}">${x.done?"Оплачено полностью ✓":"Отметить как оплачено"}</button></section>`;
  }).join("");
  return head+cards;
}

function vWeek(){
  let rs=0,os=num(S.g.base);
  const rows=DAYS.map(d=>{
    const x=D(d), r=num(x.rev), o=num(x.ord), df=r-NORM; rs+=r; os+=o;
    return `<button class="wk" data-act="go" data-d="${d}"><b>${label(d)}</b><span class="mu">${o?o+" зак.":"—"}</span><span class="num sm">${r?fmt(r):"—"}</span><span class="df ${r?(df>=0?"ok":"bad"):""}">${r?(df>=0?"+":"−")+nf(Math.abs(df)):""}</span></button>`;
  }).join("");
  return `<h1>Неделя</h1><div class="mu" style="margin-top:2px">Выручка ${fmt(rs)} · заказов ${os} из ${GOAL}</div>
  <section class="card" style="padding-top:6px;padding-bottom:6px">${rows}</section>
  <section class="card"><label class="fl">Заказов засчитано до 18 ноября<input class="in s" data-f="base" inputmode="numeric" value="${num(S.g.base)||""}" placeholder="0"></label></section>
  <div style="text-align:center"><button class="reset" data-act="reset">Сбросить все данные</button></div>`;
}

const app=document.getElementById("app"), tabs=document.getElementById("tabs");
function render(){
  const a=document.activeElement;
  const fk=a&&a.getAttribute?a.getAttribute("data-f"):null, fid=a&&a.getAttribute?a.getAttribute("data-id"):null, pos=a?a.selectionStart:null;
  const old=document.querySelector(".chips"), sl=old?old.scrollLeft:0;
  app.innerHTML=ui.tab==="pay"?vPay():(ui.tab==="week"?vWeek():vDay());
  const ch=document.querySelector(".chips"); if(ch){ch.scrollLeft=sl;}
  [].forEach.call(tabs.children,b=>b.classList.toggle("on",b.getAttribute("data-t")===ui.tab));
  if(fk){
    const n=document.querySelector('[data-f="'+fk+'"]'+(fid?'[data-id="'+fid+'"]':""));
    if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
  }
}

document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("[data-act]"); if(!b){return;}
  const act=b.getAttribute("data-act");
  if(act==="tab"){ui.tab=b.getAttribute("data-t");window.scrollTo(0,0);}
  else if(act==="day"){ui.day=b.getAttribute("data-d");}
  else if(act==="go"){ui.day=b.getAttribute("data-d");ui.tab="day";window.scrollTo(0,0);}
  else if(act==="chk"){const x=D(ui.day);x.c=x.c||{};const k=b.getAttribute("data-k");x.c[k]=!x.c[k];}
  else if(act==="inc"){const x=D(ui.day);x.ord=num(x.ord)+1;}
  else if(act==="dec"){const x=D(ui.day);x.ord=Math.max(0,num(x.ord)-1);}
  else if(act==="paid"){const x=P(b.getAttribute("data-id"));x.done=!x.done;}
  else if(act==="reset"){
    if(!confirm("Сбросить все отметки и суммы?")){return;}
    S={pay:{},days:{},g:{}};
  }
  save(); render();
});
document.addEventListener("input",e=>{
  const t=e.target, f=t.getAttribute&&t.getAttribute("data-f"); if(!f){return;}
  if(f==="rev"||f==="ord"){D(ui.day)[f]=num(t.value);}
  else if(f==="amt"||f==="paid"){P(t.getAttribute("data-id"))[f]=String(t.value).replace(/\D/g,"");}
  else if(f==="base"){S.g.base=num(t.value);}
  save(); render();
});

render();
loadRemote(render);
})();
</script>
</body>
</html>
